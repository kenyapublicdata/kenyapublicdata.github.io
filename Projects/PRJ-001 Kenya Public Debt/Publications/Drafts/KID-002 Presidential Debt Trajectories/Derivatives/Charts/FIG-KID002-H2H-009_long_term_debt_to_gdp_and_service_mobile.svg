      <text x="20" y="32" fill="#334155" font-size="16" font-weight="800">KIBAKI (2002–13)</text>
      <text x="20" y="65" fill="#059669" font-size="24" font-weight="900">61% → 36%</text>
      <text x="20" y="95" fill="#64748B" font-size="13">Debt/GDP cut nearly in half</text>
      <text x="20" y="115" fill="#64748B" font-size="13">via strong GDP growth</text>
    </g>

    <g transform="translate(345, 70)">
      <rect x="0" y="0" width="285" height="130" rx="10" fill="#F8FAFC" />
      <text x="20" y="32" fill="#D97706" font-size="16" font-weight="800">UHURU (2013–22)</text>
      <text x="20" y="65" fill="#DC2626" font-size="24" font-weight="900">36% → 64%</text>
      <text x="20" y="95" fill="#64748B" font-size="13">Aggressive borrowing surge</text>
      <text x="20" y="115" fill="#64748B" font-size="13">Eurobonds &amp; SGR rail</text>
    </g>

    <g transform="translate(655, 70)">
