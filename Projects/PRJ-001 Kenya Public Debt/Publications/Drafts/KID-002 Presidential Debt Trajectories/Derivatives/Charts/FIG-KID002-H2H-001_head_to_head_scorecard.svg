<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background-color:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<defs>
  <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05" />
  </filter>
  <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
  </filter>
</defs>

  <!-- Header -->
  <text x="60" y="52" fill="#DC2626" font-size="13" font-weight="800" letter-spacing="1.5">KENYA IN DATA • PUBLIC DEBT COMPARISON</text>
  <text x="60" y="88" fill="#0F172A" font-size="24" font-weight="900">Uhuru vs Ruto: Public Debt in Matched 4-Year Fiscal Windows</text>
  <text x="60" y="116" fill="#64748B" font-size="14" font-weight="500">Comparing debt stock expansion, GDP tracking, portfolio composition and ordinary revenue absorption</text>

  <!-- Uhuru Card -->
  <rect x="60" y="140" width="520" height="455" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
  <rect x="60" y="140" width="520" height="70" rx="14" fill="#0F172A" />
  <rect x="60" y="196" width="520" height="14" fill="#0F172A" />
  <text x="90" y="182" fill="#FFFFFF" font-size="19" font-weight="800">UHURU WINDOW (Jun 2013 → Jun 2017)</text>
  
  <!-- Row 1: Stock Change -->
  <rect x="85" y="225" width="470" height="75" rx="8" fill="#F8FAFC" />
  <text x="105" y="250" fill="#64748B" font-size="12" font-weight="600">OUTSTANDING DEBT STOCK</text>
  <text x="105" y="282" fill="#0F172A" font-size="22" font-weight="900">KSh 1.89T → KSh 4.41T</text>
  <rect x="420" y="240" width="120" height="44" rx="6" fill="#FEE2E2" />
  <text x="480" y="267" fill="#DC2626" font-size="17" font-weight="900" text-anchor="middle">+132.7%</text>
  <text x="480" y="278" fill="#DC2626" font-size="9.5" font-weight="700" text-anchor="middle">(+75.2% real)</text>
  
  <!-- Row 2: Stock Added & Debt/GDP -->
  <g transform="translate(85, 310)">
    <rect x="0" y="0" width="225" height="75" rx="8" fill="#F8FAFC" />
    <text x="15" y="24" fill="#64748B" font-size="11" font-weight="600">NET STOCK ADDED</text>
    <text x="15" y="56" fill="#0F172A" font-size="20" font-weight="800">+KSh 2.51T</text>
  </g>
  <g transform="translate(330, 310)">
    <rect x="0" y="0" width="225" height="75" rx="8" fill="#F8FAFC" />
    <text x="15" y="24" fill="#64748B" font-size="11" font-weight="600">DEBT-TO-GDP CHANGE</text>
    <text x="15" y="56" fill="#DC2626" font-size="20" font-weight="800">42.1% → 57.2%</text>
    <text x="15" y="68" fill="#DC2626" font-size="10.5" font-weight="700">+15.1 pp (outpaced GDP)</text>
  </g>

  <!-- Row 3: Key Driver & Debt Service -->
  <g transform="translate(85, 395)">
    <rect x="0" y="0" width="225" height="85" rx="8" fill="#F8FAFC" />
    <text x="15" y="24" fill="#64748B" font-size="11" font-weight="600">DRIVER OF STOCK INCREASE</text>
    <text x="15" y="52" fill="#D97706" font-size="16.5" font-weight="800">External Debt (57.7%)</text>
    <text x="15" y="70" fill="#64748B" font-size="11">Eurobonds &amp; Bilateral (SGR)</text>
  </g>
  <g transform="translate(330, 395)">
    <rect x="0" y="0" width="225" height="85" rx="8" fill="#F8FAFC" />
    <text x="15" y="24" fill="#64748B" font-size="11" font-weight="600">INTEREST / ORDINARY REVENUE</text>
    <text x="15" y="52" fill="#059669" font-size="20" font-weight="900">20.8%</text>
    <text x="15" y="70" fill="#64748B" font-size="11">KSh 271B interest (FY16/17)</text>
  </g>
  
  <!-- Uhuru Takeaway Badge -->
  <rect x="85" y="495" width="470" height="75" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
  <text x="105" y="525" fill="#0F172A" font-size="12.5" font-weight="800">CORE CHARACTERISTIC: RAPID ACCUMULATION</text>
  <text x="105" y="548" fill="#334155" font-size="11.5">Grew stock 2.7x faster; debt outran GDP growth (+15.1 pp); lower carrying cost.</text>

  <!-- Ruto Card -->
  <rect x="620" y="140" width="520" height="455" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />
  <rect x="620" y="140" width="520" height="70" rx="14" fill="#2563EB" />
  <rect x="620" y="196" width="520" height="14" fill="#2563EB" />
  <text x="650" y="182" fill="#FFFFFF" font-size="19" font-weight="800">RUTO-ERA WINDOW (Jun 2022 → Jun 2026*)</text>
  
  <!-- Row 1: Stock Change -->
  <rect x="645" y="225" width="470" height="75" rx="8" fill="#F8FAFC" />
  <text x="665" y="250" fill="#64748B" font-size="12" font-weight="600">OUTSTANDING DEBT STOCK</text>
  <text x="665" y="282" fill="#0F172A" font-size="22" font-weight="900">KSh 8.76T → ~KSh 13.01T*</text>
  <rect x="980" y="240" width="120" height="44" rx="6" fill="#EFF6FF" />
  <text x="1040" y="267" fill="#2563EB" font-size="17" font-weight="900" text-anchor="middle">+48.5%*</text>
  <text x="1040" y="278" fill="#2563EB" font-size="9.5" font-weight="700" text-anchor="middle">(+19.1% real)</text>
  
  <!-- Row 2: Stock Added & Debt/GDP -->
  <g transform="translate(645, 310)">
    <rect x="0" y="0" width="225" height="75" rx="8" fill="#F8FAFC" />
    <text x="15" y="24" fill="#64748B" font-size="11" font-weight="600">NET STOCK ADDED</text>
    <text x="15" y="56" fill="#0F172A" font-size="20" font-weight="800">+KSh 4.25T*</text>
  </g>
  <g transform="translate(890, 310)">
    <rect x="0" y="0" width="225" height="75" rx="8" fill="#F8FAFC" />
    <text x="15" y="24" fill="#64748B" font-size="11" font-weight="600">DEBT-TO-GDP CHANGE</text>
    <text x="15" y="56" fill="#059669" font-size="20" font-weight="800">68.7% → ~68.5%*</text>
    <text x="15" y="68" fill="#059669" font-size="10.5" font-weight="700">-0.2 pp (endpoint flat)</text>
  </g>

  <!-- Row 3: Key Driver & Debt Service -->
  <g transform="translate(645, 395)">
    <rect x="0" y="0" width="225" height="85" rx="8" fill="#F8FAFC" />
    <text x="15" y="24" fill="#64748B" font-size="11" font-weight="600">DRIVER OF STOCK INCREASE</text>
    <text x="15" y="52" fill="#2563EB" font-size="16.5" font-weight="800">Domestic Debt (68.3%)</text>
    <text x="15" y="70" fill="#64748B" font-size="11">T-Bonds &amp; Local Securities</text>
  </g>
  <g transform="translate(890, 395)">
    <rect x="0" y="0" width="225" height="85" rx="8" fill="#F8FAFC" />
    <text x="15" y="24" fill="#64748B" font-size="11" font-weight="600">INTEREST / ORDINARY REVENUE</text>
    <text x="15" y="52" fill="#DC2626" font-size="20" font-weight="900">40.8%</text>
    <text x="15" y="70" fill="#DC2626" font-size="11" font-weight="600">KSh 988B interest (FY24/25)</text>
  </g>
  
  <!-- Ruto Takeaway Badge -->
  <rect x="645" y="495" width="470" height="75" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
  <text x="665" y="525" fill="#0F172A" font-size="12.5" font-weight="800">CORE CHARACTERISTIC: REVENUE SQUEEZE</text>
  <text x="665" y="548" fill="#334155" font-size="11.5">Added +KSh 4.25T on a large base; endpoint debt/GDP flat; interest burden doubled to 40.8%.</text>

  <!-- Footer -->
  <line x1="60" y1="615" x2="1140" y2="615" stroke="#E2E8F0" stroke-width="1.2" />
  <text x="60" y="642" fill="#64748B" font-size="11.5" font-style="italic">Data: National Treasury Annual Debt Reports (2016/17, 2024/25), June 2026 Monthly Bulletin; KNBS CPI series  |  *June 2026 figures are provisional. Ruto took office Sept 2022; June 2022–2026 provides standardized fiscal window.</text>
  <text x="1140" y="642" fill="#0F172A" font-size="11.5" font-weight="700" text-anchor="end">Analysis: Kenya in Data • kenyaindata.org</text>
</svg>
