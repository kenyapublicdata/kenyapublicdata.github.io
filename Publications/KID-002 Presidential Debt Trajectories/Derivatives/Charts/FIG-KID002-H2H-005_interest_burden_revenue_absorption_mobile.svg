<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" style="background-color:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<defs>
  <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05" />
  </filter>
  <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
  </filter>
</defs>

  <!-- Mobile Header -->
  <text x="50" y="70" fill="#DC2626" font-size="16" font-weight="800" letter-spacing="1.5">KENYA IN DATA • PUBLIC DEBT</text>
  <text x="50" y="118" fill="#0F172A" font-size="34" font-weight="900">The Revenue Squeeze: Interest / Revenue</text>
  <text x="50" y="156" fill="#64748B" font-size="19" font-weight="500">Under Uhuru, interest took 20.8% of ordinary revenue. Under Ruto, it consumes 40.8%.</text>

  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="980" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#card-shadow)" />
    <text x="35" y="45" fill="#0F172A" font-size="24" font-weight="900">UHURU WINDOW: Interest / Ordinary Revenue</text>
<line x1="90" y1="184.0" x2="930" y2="184.0" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4" /><text x="930" y="176.0" fill="#DC2626" font-size="14" font-weight="700" text-anchor="end">30% Stress Line</text><line x1="90" y1="288.0" x2="930" y2="288.0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" /><text x="75" y="293.0" fill="#64748B" font-size="15" text-anchor="end">10%</text><line x1="90" y1="236.0" x2="930" y2="236.0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" /><text x="75" y="241.0" fill="#64748B" font-size="15" text-anchor="end">20%</text><line x1="90" y1="184.0" x2="930" y2="184.0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" /><text x="75" y="189.0" fill="#64748B" font-size="15" text-anchor="end">30%</text><line x1="90" y1="132.0" x2="930" y2="132.0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" /><text x="75" y="137.0" fill="#64748B" font-size="15" text-anchor="end">40%</text><line x1="90" y1="80.0" x2="930" y2="80.0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" /><text x="75" y="85.0" fill="#64748B" font-size="15" text-anchor="end">50%</text><rect x="129.05" y="258.88" width="107.9" height="81.12" rx="8" fill="#334155" /><text x="183.0" y="248.88" fill="#334155" font-size="17" font-weight="900" text-anchor="middle">15.6%</text><text x="183.0" y="370" fill="#64748B" font-size="16" font-weight="700" text-anchor="middle">FY12/13</text><rect x="295.05" y="263.56" width="107.9" height="76.44" rx="8" fill="#334155" /><text x="349.0" y="253.56" fill="#334155" font-size="17" font-weight="900" text-anchor="middle">14.7%</text><text x="349.0" y="370" fill="#64748B" font-size="16" font-weight="700" text-anchor="middle">FY13/14</text><rect x="461.05" y="252.64" width="107.9" height="87.36000000000001" rx="8" fill="#334155" /><text x="515.0" y="242.64" fill="#334155" font-size="17" font-weight="900" text-anchor="middle">16.8%</text><text x="515.0" y="370" fill="#64748B" font-size="16" font-weight="700" text-anchor="middle">FY14/15</text><rect x="627.05" y="243.27999999999997" width="107.9" height="96.72000000000003" rx="8" fill="#334155" /><text x="681.0" y="233.27999999999997" fill="#334155" font-size="17" font-weight="900" text-anchor="middle">18.6%</text><text x="681.0" y="370" fill="#64748B" font-size="16" font-weight="700" text-anchor="middle">FY15/16</text><rect x="793.05" y="231.83999999999997" width="107.9" height="108.16000000000003" rx="8" fill="#DC2626" /><text x="847.0" y="221.83999999999997" fill="#DC2626" font-size="17" font-weight="900" text-anchor="middle">20.8%</text><text x="847.0" y="370" fill="#64748B" font-size="16" font-weight="700" text-anchor="middle">FY16/17</text></g>

  <g transform="translate(50, 650)">
    <rect x="0" y="0" width="980" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#card-shadow)" />
    <text x="35" y="45" fill="#0F172A" font-size="24" font-weight="900">RUTO WINDOW: Interest / Ordinary Revenue</text>
<line x1="90" y1="184.0" x2="930" y2="184.0" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4" /><text x="930" y="176.0" fill="#DC2626" font-size="14" font-weight="700" text-anchor="end">30% Stress Line</text><line x1="90" y1="288.0" x2="930" y2="288.0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" /><text x="75" y="293.0" fill="#64748B" font-size="15" text-anchor="end">10%</text><line x1="90" y1="236.0" x2="930" y2="236.0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" /><text x="75" y="241.0" fill="#64748B" font-size="15" text-anchor="end">20%</text><line x1="90" y1="184.0" x2="930" y2="184.0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" /><text x="75" y="189.0" fill="#64748B" font-size="15" text-anchor="end">30%</text><line x1="90" y1="132.0" x2="930" y2="132.0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" /><text x="75" y="137.0" fill="#64748B" font-size="15" text-anchor="end">40%</text><line x1="90" y1="80.0" x2="930" y2="80.0" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" /><text x="75" y="85.0" fill="#64748B" font-size="15" text-anchor="end">50%</text><rect x="129.05" y="183.48000000000002" width="107.9" height="156.51999999999998" rx="8" fill="#2563EB" /><text x="183.0" y="173.48000000000002" fill="#2563EB" font-size="17" font-weight="900" text-anchor="middle">30.1%</text><text x="183.0" y="370" fill="#64748B" font-size="16" font-weight="700" text-anchor="middle">FY21/22</text><rect x="295.05" y="164.24" width="107.9" height="175.76" rx="8" fill="#2563EB" /><text x="349.0" y="154.24" fill="#2563EB" font-size="17" font-weight="900" text-anchor="middle">33.8%</text><text x="349.0" y="370" fill="#64748B" font-size="16" font-weight="700" text-anchor="middle">FY22/23</text><rect x="461.05" y="148.12" width="107.9" height="191.88" rx="8" fill="#2563EB" /><text x="515.0" y="138.12" fill="#2563EB" font-size="17" font-weight="900" text-anchor="middle">36.9%</text><text x="515.0" y="370" fill="#64748B" font-size="16" font-weight="700" text-anchor="middle">FY23/24</text><rect x="627.05" y="127.84" width="107.9" height="212.16" rx="8" fill="#DC2626" /><text x="681.0" y="117.84" fill="#DC2626" font-size="17" font-weight="900" text-anchor="middle">40.8%</text><text x="681.0" y="370" fill="#64748B" font-size="16" font-weight="700" text-anchor="middle">FY24/25</text><rect x="793.05" y="133.04000000000002" width="107.9" height="206.95999999999998" rx="8" fill="#DC2626" /><text x="847.0" y="123.04000000000002" fill="#DC2626" font-size="17" font-weight="900" text-anchor="middle">39.8%</text><text x="847.0" y="370" fill="#64748B" font-size="16" font-weight="700" text-anchor="middle">FY25/26*</text></g>

  <g transform="translate(50, 1100)">
    <rect x="0" y="0" width="980" height="120" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" />
    <text x="35" y="42" fill="#DC2626" font-size="20" font-weight="900">THE REVENUE SQUEEZE TODAY</text>
    <text x="35" y="75" fill="#0F172A" font-size="17" font-weight="700">More than KSh 4 out of every KSh 10 of ordinary revenue now goes strictly to interest payments,</text>
    <text x="35" y="100" fill="#334155" font-size="16">severely crowding out development expenditure and county equitable revenue shares.</text>
  </g>

  <!-- Mobile Footer -->
  <line x1="50" y1="1260" x2="1030" y2="1260" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="50" y="1295" fill="#64748B" font-size="17" font-style="italic">Data: National Treasury Annual Debt Reports; FY25/26 Projections  |  *FY25/26 is Kenya in Data calculation from Treasury component projections.</text>
  <text x="50" y="1325" fill="#0F172A" font-size="17.5" font-weight="800">Kenya in Data • kenyaindata.org</text>
</svg>
