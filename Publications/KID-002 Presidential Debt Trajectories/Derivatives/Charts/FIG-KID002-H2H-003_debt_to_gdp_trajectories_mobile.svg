<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" style="background-color:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<defs>
  <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05" />
  </filter>
  <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
  </filter>
</defs>

  <!-- Mobile Header -->
  <text x="50" y="70" fill="#DC2626" font-size="16" font-weight="800" letter-spacing="1.5">KENYA IN DATA • PUBLIC DEBT</text>
  <text x="50" y="118" fill="#0F172A" font-size="34" font-weight="900">Debt-to-GDP: First 4 Fiscal Years</text>
  <text x="50" y="156" fill="#64748B" font-size="19" font-weight="500">Uhuru outpaced GDP (+15.1 pp); endpoint-to-endpoint, Ruto ratio held virtually flat</text>
<line x1="140" y1="892.5" x2="940" y2="892.5" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,6" /><text x="120" y="898.5" fill="#64748B" font-size="20" font-weight="700" text-anchor="end">40%</text><line x1="140" y1="717.5" x2="940" y2="717.5" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,6" /><text x="120" y="723.5" fill="#64748B" font-size="20" font-weight="700" text-anchor="end">50%</text><line x1="140" y1="630.0" x2="940" y2="630.0" stroke="#059669" stroke-width="3" stroke-dasharray="8,6" /><text x="940" y="618.0" fill="#059669" font-size="18" font-weight="900" text-anchor="end">55% Statutory Debt Anchor</text><line x1="140" y1="542.5" x2="940" y2="542.5" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,6" /><text x="120" y="548.5" fill="#64748B" font-size="20" font-weight="700" text-anchor="end">60%</text><line x1="140" y1="367.5" x2="940" y2="367.5" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,6" /><text x="120" y="373.5" fill="#64748B" font-size="20" font-weight="700" text-anchor="end">70%</text><line x1="140.0" y1="980" x2="140.0" y2="992" stroke="#64748B" stroke-width="2" /><text x="140.0" y="1022" fill="#0F172A" font-size="22" font-weight="800" text-anchor="middle">Year 0</text><text x="140.0" y="1050" fill="#64748B" font-size="16" text-anchor="middle">U: Jun 2013</text><text x="140.0" y="1072" fill="#64748B" font-size="16" text-anchor="middle">R: Jun 2022</text><line x1="340.0" y1="980" x2="340.0" y2="992" stroke="#64748B" stroke-width="2" /><text x="340.0" y="1022" fill="#0F172A" font-size="22" font-weight="800" text-anchor="middle">Year 1</text><text x="340.0" y="1050" fill="#64748B" font-size="16" text-anchor="middle">U: Jun 2014</text><text x="340.0" y="1072" fill="#64748B" font-size="16" text-anchor="middle">R: Jun 2023</text><line x1="540.0" y1="980" x2="540.0" y2="992" stroke="#64748B" stroke-width="2" /><text x="540.0" y="1022" fill="#0F172A" font-size="22" font-weight="800" text-anchor="middle">Year 2</text><text x="540.0" y="1050" fill="#64748B" font-size="16" text-anchor="middle">U: Jun 2015</text><text x="540.0" y="1072" fill="#64748B" font-size="16" text-anchor="middle">R: Jun 2024</text><line x1="740.0" y1="980" x2="740.0" y2="992" stroke="#64748B" stroke-width="2" /><text x="740.0" y="1022" fill="#0F172A" font-size="22" font-weight="800" text-anchor="middle">Year 3</text><text x="740.0" y="1050" fill="#64748B" font-size="16" text-anchor="middle">U: Jun 2016</text><text x="740.0" y="1072" fill="#64748B" font-size="16" text-anchor="middle">R: Jun 2025</text><line x1="940.0" y1="980" x2="940.0" y2="992" stroke="#64748B" stroke-width="2" /><text x="940.0" y="1022" fill="#0F172A" font-size="22" font-weight="800" text-anchor="middle">Year 4</text><text x="940.0" y="1050" fill="#64748B" font-size="16" text-anchor="middle">U: Jun 2017</text><text x="940.0" y="1072" fill="#64748B" font-size="16" text-anchor="middle">R: Jun 2026*</text><polyline points="140.0,855.75 340.0,752.5 540.0,719.25 740.0,621.25 940.0,591.5" fill="none" stroke="#DC2626" stroke-width="6.5" /><polyline points="140.0,390.25 340.0,332.5 540.0,421.7499999999999 740.0,406.0 940.0,393.75" fill="none" stroke="#2563EB" stroke-width="6.5" /><circle cx="140.0" cy="855.75" r="10" fill="#DC2626" stroke="#FFFFFF" stroke-width="3" /><text x="140.0" y="837.75" fill="#DC2626" font-size="19" font-weight="900" text-anchor="middle">42.1%</text><circle cx="140.0" cy="390.25" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="3" /><text x="140.0" y="372.25" fill="#2563EB" font-size="19" font-weight="900" text-anchor="middle">68.7%</text><circle cx="340.0" cy="752.5" r="10" fill="#DC2626" stroke="#FFFFFF" stroke-width="3" /><text x="340.0" y="734.5" fill="#DC2626" font-size="19" font-weight="900" text-anchor="middle">48.0%</text><circle cx="340.0" cy="332.5" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="3" /><text x="340.0" y="314.5" fill="#2563EB" font-size="19" font-weight="900" text-anchor="middle">72.0%</text><circle cx="540.0" cy="719.25" r="10" fill="#DC2626" stroke="#FFFFFF" stroke-width="3" /><text x="540.0" y="701.25" fill="#DC2626" font-size="19" font-weight="900" text-anchor="middle">49.9%</text><circle cx="540.0" cy="421.7499999999999" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="3" /><text x="540.0" y="403.7499999999999" fill="#2563EB" font-size="19" font-weight="900" text-anchor="middle">66.9%</text><circle cx="740.0" cy="621.25" r="10" fill="#DC2626" stroke="#FFFFFF" stroke-width="3" /><text x="740.0" y="603.25" fill="#DC2626" font-size="19" font-weight="900" text-anchor="middle">55.5%</text><circle cx="740.0" cy="406.0" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="3" /><text x="740.0" y="388.0" fill="#2563EB" font-size="19" font-weight="900" text-anchor="middle">67.8%</text><circle cx="940.0" cy="591.5" r="10" fill="#DC2626" stroke="#FFFFFF" stroke-width="3" /><text x="940.0" y="573.5" fill="#DC2626" font-size="19" font-weight="900" text-anchor="middle">57.2%</text><circle cx="940.0" cy="393.75" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="3" /><text x="940.0" y="375.75" fill="#2563EB" font-size="19" font-weight="900" text-anchor="middle">68.5%</text>
  <g transform="translate(60, 1110)">
    <rect x="0" y="0" width="450" height="110" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" filter="url(#card-shadow)" />
    <text x="25" y="38" fill="#DC2626" font-size="24" font-weight="900">UHURU: 42.1% → 57.2%</text>
    <text x="25" y="70" fill="#DC2626" font-size="19" font-weight="700">+15.1 pp Debt-to-GDP surge</text>
    <text x="25" y="94" fill="#64748B" font-size="16">Debt accumulated faster than GDP</text>
  </g>
  <g transform="translate(570, 1110)">
    <rect x="0" y="0" width="450" height="110" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#card-shadow)" />
    <text x="25" y="38" fill="#2563EB" font-size="24" font-weight="900">RUTO: 68.7% → ~68.5%*</text>
    <text x="25" y="70" fill="#059669" font-size="19" font-weight="700">-0.2 pp (Endpoint flat)</text>
    <text x="25" y="94" fill="#64748B" font-size="16">Pathway: 68.7% → 72.0% → 66.9% → 67.8% → 68.5%</text>
  </g>

