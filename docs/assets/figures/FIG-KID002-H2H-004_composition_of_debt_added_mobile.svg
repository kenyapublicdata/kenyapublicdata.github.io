<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" style="background-color:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<defs>
  <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05" />
  </filter>
  <filter id="subtle-shadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
  </filter>
</defs>

  <!-- Mobile Header -->
  <text x="50" y="70" fill="#DC2626" font-size="16" font-weight="800" letter-spacing="1.5">KENYA IN DATA • PUBLIC DEBT</text>
  <text x="50" y="118" fill="#0F172A" font-size="34" font-weight="900">Composition of Net Debt Added: Uhuru vs Ruto</text>
  <text x="50" y="156" fill="#64748B" font-size="19" font-weight="500">Uhuru window was external-led (57.7%); Ruto window pivoted to domestic debt (68.3%)</text>

  <!-- Uhuru Section Mobile -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="980" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#card-shadow)" />
    <text x="40" y="55" fill="#0F172A" font-size="28" font-weight="900">UHURU: +KSh 2.51 Trillion Net Stock Added</text>
    <text x="40" y="90" fill="#64748B" font-size="18">Jun 2013 → Jun 2017 (External-Heavy Expansion)</text>
    
    <!-- 100% Bar -->
    <rect x="40" y="120" width="380" height="80" rx="10" fill="#2563EB" />
    <rect x="420" y="120" width="520" height="80" rx="10" fill="#D97706" />
    <rect x="415" y="120" width="10" height="80" fill="#D97706" />
    
    <!-- Stat 1: Domestic -->
    <rect x="40" y="230" width="430" height="140" rx="12" fill="#EFF6FF" />
    <text x="65" y="270" fill="#2563EB" font-size="22" font-weight="900">DOMESTIC: 42.3%</text>
    <text x="65" y="308" fill="#0F172A" font-size="26" font-weight="800">+KSh 1.06 Trillion</text>
    <text x="65" y="340" fill="#64748B" font-size="16">Treasury bills and bonds</text>

    <!-- Stat 2: External -->
    <rect x="510" y="230" width="430" height="140" rx="12" fill="#FEF3C7" />
    <text x="535" y="270" fill="#D97706" font-size="22" font-weight="900">EXTERNAL: 57.7%</text>
    <text x="535" y="308" fill="#0F172A" font-size="26" font-weight="800">+KSh 1.45 Trillion</text>
    <text x="535" y="340" fill="#334155" font-size="16">Eurobonds &amp; bilateral loans</text>
  </g>

  <!-- Ruto Section Mobile -->
  <g transform="translate(50, 660)">
    <rect x="0" y="0" width="980" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#card-shadow)" />
    <text x="40" y="55" fill="#0F172A" font-size="28" font-weight="900">RUTO: +KSh 4.25 Trillion Net Stock Added*</text>
    <text x="40" y="90" fill="#64748B" font-size="18">Jun 2022 → Jun 2026* (Domestic-Heavy Expansion)</text>
    
    <!-- 100% Bar -->
    <rect x="40" y="120" width="615" height="80" rx="10" fill="#2563EB" />
    <rect x="655" y="120" width="285" height="80" rx="10" fill="#D97706" />
    <rect x="650" y="120" width="10" height="80" fill="#D97706" />
    
    <!-- Stat 1: Domestic -->
    <rect x="40" y="230" width="430" height="140" rx="12" fill="#EFF6FF" />
    <text x="65" y="270" fill="#2563EB" font-size="22" font-weight="900">DOMESTIC: 68.3%</text>
    <text x="65" y="308" fill="#0F172A" font-size="26" font-weight="800">+KSh 2.90 Trillion</text>
    <text x="65" y="340" fill="#64748B" font-size="16">Local Treasury bonds &amp; bills</text>

    <!-- Stat 2: External -->
    <rect x="510" y="230" width="430" height="140" rx="12" fill="#FEF3C7" />
    <text x="535" y="270" fill="#D97706" font-size="22" font-weight="900">EXTERNAL: 31.7%</text>
    <text x="535" y="308" fill="#0F172A" font-size="26" font-weight="800">+KSh 1.35 Trillion*</text>
    <text x="535" y="340" fill="#334155" font-size="16">Multilateral funding &amp; commercial</text>
  </g>

  <!-- Explainer Mobile -->
  <g transform="translate(50, 1115)">
    <rect x="0" y="0" width="980" height="110" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="35" y="40" fill="#0F172A" font-size="18" font-weight="900">THE COST IMPLICATION</text>
    <text x="35" y="72" fill="#334155" font-size="16.5">At June 2025, Treasury reported a weighted-average interest rate of 13.0% on domestic debt</text>
    <text x="35" y="96" fill="#334155" font-size="16.5">versus 3.9% on external debt, explaining the sharp rise in budget carrying costs.</text>
  </g>

  <!-- Mobile Footer -->
  <line x1="50" y1="1260" x2="1030" y2="1260" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="50" y="1295" fill="#64748B" font-size="17" font-style="italic">Data: National Treasury Annual Reports; June 2026 Bulletin  |  *June 2026 figures are provisional.</text>
  <text x="50" y="1325" fill="#0F172A" font-size="17.5" font-weight="800">Kenya in Data • kenyaindata.org</text>
</svg>
